    label: Fire test
    panel_id: p
    kind: press
    verified_on: 2026-09-02
    binding: {press: fake/fire_test/press}
  - control_id: needs_fire_test
    label: Needs fire test
    panel_id: p
    kind: toggle
    verified_on: 2026-09-02
