parked:
  - control_id: battery
    label: Battery
    panel_id: overhead
    since: 2026-09-03
    reason: >-
      Real binding found live (electric/battery_pos; switch/battery_up/dn)
      but not actuated: generators and GPU were OFF, so battery may be the
      sole power source and this session cannot restart the sim.

  - control_id: standby_power
    label: Standby power
    panel_id: overhead
    since: 2026-09-03
    reason: >-
      Real read found live (electric/standby_bat_pos=1.0, four candidate
      commands) but which pair drives it and what its positions mean was
      not determined — same sole-power-source risk as battery.

  - control_id: gen_drive_disc1
    label: Generator drive disconnect 1
    panel_id: overhead
    since: 2026-09-03
    reason: >-
      Real binding found live (drive_disconnect1_pos=0.0, on/off commands)
      but not actuated: a real CSD disconnect is one-way maintenance-only,
      and Zibo's one_way_switch naming hints at the same.

  - control_id: gen_drive_disc2
    label: Generator drive disconnect 2
    panel_id: overhead
    since: 2026-09-03
    reason: >-
      Same finding as gen_drive_disc1 (drive_disconnect2_pos=0.0),
      deliberately not actuated for the same one-way-disconnect risk.

  - control_id: bus_transfer
    label: Bus transfer
    panel_id: overhead
    since: 2026-09-03
    reason: >-
      Confirmed absent live: grepped the sim's full dataref/command index
      for bus_tr*/bus_tie*/transfer* — nothing beyond the read-only
      trans_bus_off1/2 annunciators exists.

  - control_id: irs_l
    label: IRS mode selector (L)
    panel_id: overhead
    since: 2026-09-03
    reason: >-
      Live read found (irs/irs_mode=2.0, consistent with NAV) but no
      selector command — every irs_L_*/irs_R_* command belongs to the
      display unit. Disturbing NAV forces a realignment #224 inherits.

  - control_id: irs_r
    label: IRS mode selector (R)
    panel_id: overhead
    since: 2026-09-03
    reason: >-
      Same finding as irs_l (irs/irs2_mode=2.0), not actuated for the
      same realignment risk.
