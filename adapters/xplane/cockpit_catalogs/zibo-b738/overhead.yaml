# Zibo Mod B737-800X — Overhead panel.
#
# Wave 2, issue #223. Phase 1 (docs/research/zibo-737-overhead-dataref-mapping.md)
# discovered candidates from the add-on's static reference files only, with no
# live sim access. Phase 2 (this file) live-verified every entry below against
# a running X-Plane 12.4.3 + Zibo 4.05.33 at LEMD, through the real adapter
# code path (adapters/xplane/cockpit_controls.py's CockpitRuntime executors,
# exercised via tests/sim/test_live_cockpit_catalog.py's generic sweep) —
# never a hand-rolled HTTP call.
#
# Phase 1's biggest gap — battery/standby power/generators/GEN drive/external
# power had NO candidate in the vendor's bundled B738_Datarefs.txt /
# B738_Commands.txt reference files at all — turned out to be a documentation
# gap, not a missing feature: live discovery (grepping the connected sim's own
# full dataref/command index, GET /api/v2/datarefs and /api/v2/commands, the
# same endpoint connect() already scans) found a `laminar/B738/electrical/*`
# and `laminar/B738/electric/*` namespace the static files never mention at
# all (gen1_pos/gen2_pos/apu_gen1_pos/apu_gen2_pos/gpu_pos live under
# `electrical/`; battery_pos/standby_bat_pos live under `electric/` — note the
# two different, both real, prefixes).
#
# Not every live-found candidate is in `controls:` below, on purpose: battery,
# standby power, the generator drive disconnects and the IRS mode selectors
# were deliberately NOT actuated this session even though a real binding was
# found for most of them — see `parked:` below for exactly why (destructive
# or hard-to-recover risk to a shared live session, not an unverified name).
controls:
  # --- Electrical -----------------------------------------------------------
  - control_id: gen1
    label: Generator 1
    panel_id: overhead
    kind: selector
    options:
      - {value: 0, label: "OFF"}
      - {value: 1, label: "ON"}
    hint: "gen1_up|dn resolve live but don't move this switch — writes the position dataref directly instead."
    verified_on: 2026-09-03
    live_sweep: true
    binding:
      read: laminar/B738/electrical/gen1_pos
      write: laminar/B738/electrical/gen1_pos

