[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-instructor-station"
version = "0.2.0"
description = "External instructor station for flight simulators (X-Plane 12, MSFS planned)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "websockets>=13.0",
    "geographiclib>=2.0",
    "pyyaml>=6.0",
    # Required by FastAPI's `UploadFile`/`File(...)` — the Training Profiles
    # import endpoint is the first multipart upload in this codebase.
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    # The test runner is pinned to a minor range for the same reason as the linters
    # below: an unbounded floor is how `pytest>=8.3` quietly became **9.1.1**, a major
    # the project never chose (same story as the old `mypy>=1.13` resolving 2.x). A
    # pytest major can change collection rules, fixture semantics or defaults, and the
    # result is a red pipeline nobody caused — which breaks the rule that a red run is
    # never bypassed, because that rule only holds while red reliably means "you broke
    # something". The plugins get the same treatment: pytest-asyncio had already
    # crossed its own 0.x -> 1.x major under `>=0.24`, and it owns `asyncio_mode`.
    # Bump these deliberately, as their own reviewable change, with a full `pytest` run
    # in the same commit.
    "pytest>=9.1.1,<9.2",
    "pytest-asyncio>=1.4,<1.5",
    "pytest-cov>=7.1,<7.2",
    # Ruff and mypy are pinned to a minor range ON PURPOSE. Both redefine what
    # "correct" means between minor releases: ruff 0.16 started formatting Python
    # code blocks inside Markdown and failed `lint-py` on a prose-only PR, and mypy
    # adds new diagnostics under `strict = true` (an unbounded `mypy>=1.13` had
    # already let the 2.x major in unnoticed). Unpinned linters make the required
    # checks non-reproducible — the same commit passes today and fails tomorrow —
    # and a red run nobody caused erodes the rule that CI is never bypassed.
    # Bump these deliberately, as their own reviewable change, and re-run
    # `ruff format --check .` (Markdown included) in the same commit.
    "ruff>=0.16.1,<0.17",
    "mypy>=2.3,<2.4",
    # Stub packages feed mypy under `strict = true`, so they can turn a passing file
    # red without a line of ours changing. The bound is on the PyYAML API line the
    # stubs target; note it cannot freeze the stub *date*, because every release in
    # this line is `6.0.12.<date>` — only an exact pin would, and that trades a real
    # risk for constant bump churn over a single `yaml` import surface.
    "types-pyyaml>=6.0.12,<6.1",
    # Packaging: builds the double-clickable executable from packaging/*.spec.
    "pyinstaller>=6.11",
]

[project.scripts]
instructor-station = "server.__main__:main"

[tool.setuptools]
packages = [
    "core",
    "core.camera",
    "core.cockpit",
    "core.navdata",
    "core.navdata.xplane_native",
    "core.weather",
    "core.fuel_payload",
    "core.scenarios",
    "core.profiles",
    "adapters",
    "adapters.fake",
    "adapters.xplane",
    "server",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["ui", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiom for a required multipart upload is `File(...)` as the
# parameter default; B008 exists to catch mutable-default bugs, not this.
extend-immutable-calls = ["fastapi.File"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"spikes/**" = ["ANN", "T201"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["ui/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["geographiclib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `xp` is XPPython3's in-sim API module: it only exists inside the interpreter
# X-Plane embeds, never in this project's environment. Only the throwaway
# bridge spike plugin (spikes/PI_OISBridgeSpike.py) imports it.
module = ["xp"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The default run excludes everything CI can never have: a live simulator, and the
# user's own X-Plane navdata install (hard rule 4 — navdata is never redistributed,
# so it cannot be committed as a fixture either). An explicit command-line -m wins
# over addopts, so `pytest -m sim` and `pytest -m navdata` remain the escape hatches.
addopts = ["-m", "not sim and not navdata", "--strict-markers"]
markers = [
    "sim: requires a live simulator (X-Plane Web API on localhost:8086). Never runs in CI.",
    "navdata: requires the user's own X-Plane navdata installation. Never runs in CI.",
]
