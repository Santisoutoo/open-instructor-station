[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-instructor-station"
version = "0.1.0"
description = "External instructor station for flight simulators (X-Plane 12, MSFS planned)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "websockets>=13.0",
    "geographiclib>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[project.scripts]
instructor-station = "server.__main__:main"

[tool.setuptools]
packages = [
    "core",
    "adapters",
    "adapters.fake",
    "adapters.xplane",
    "server",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["ui", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"spikes/**" = ["ANN", "T201"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["ui/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["geographiclib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default run excludes tests that need a live simulator. `pytest -m sim`
# overrides this (command-line -m wins over addopts).
addopts = ["-m", "not sim", "--strict-markers"]
markers = [
    "sim: requires a live simulator (X-Plane Web API on localhost:8086). Never runs in CI.",
]
