name: "Unstable approach"
description: >
  Final for runway 36 at ZZZZ, deliberately not stabilised: well above the
  category's normal approach speed, flaps only partly extended and the gear
  still up — a pure position-and-state exercise for recognising an unstable
  approach and calling the go-around.
tags: [position, unstable-approach, approach]

position:
  type: runway
  airport_icao: ZZZZ
  runway_ident: "36"
  placement: final_3nm

aircraft_state:
  ias_kt: 170.0
  flaps_ratio: 0.25
  gear_down: false
