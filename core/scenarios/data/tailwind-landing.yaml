name: "Tailwind landing"
description: >
  Final for runway 36 at ZZZZ (true bearing 000°) with the wind blowing from
  180° at 12 kt gusting 18 — roughly aligned with the runway but from behind,
  for a landing performance and go-around decision exercise. No shipped
  preset covers this case, so the wind is stated explicitly.
tags: [weather, tailwind, approach, landing]

position:
  type: runway
  airport_icao: ZZZZ
  runway_ident: "36"
  placement: final_3nm

weather:
  setup:
    wind_layers:
      - altitude_ft: 1000.0
        direction_deg: 180.0
        speed_kt: 12.0
        gust_increase_kt: 6.0
