name: Release

# Builds the UI, packages a single executable with PyInstaller (bundling ui/dist),
# smoke-tests it, uploads it as a workflow artifact and attaches it to a DRAFT
# GitHub Release.
#
# The executable is UNSIGNED. Windows SmartScreen will warn on first run. Signing,
# an installer and auto-update are out of scope here (see #27).
#
# Windows is the only enabled target for now (X-Plane's primary platform and the only
# one MSFS supports). The matrix is written so macOS and Linux can be enabled later by
# uncommenting their entries — nothing else in the file needs to change.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # required to create the draft release

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: instructor-station-windows
            binary-path: dist/instructor-station.exe
          # Enable later by uncommenting — no other change required:
          # - os: macos-latest
          #   artifact-name: instructor-station-macos
          #   binary-path: dist/instructor-station
          # - os: ubuntu-latest
          #   artifact-name: instructor-station-linux
          #   binary-path: dist/instructor-station
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The dev extra is where the PyInstaller version constraint lives, so the
      # release build and a local build agree on the packager.
      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The spec bundles ui/dist as static assets so the packaged executable starts the
      # local server and serves the UI without a Node runtime. See docs/architecture.md.
      - name: PyInstaller — single executable
        run: python -m PyInstaller packaging/instructor-station.spec --noconfirm --clean

      # A tag must not ship a binary nobody launched. Start it, then assert the API
      # answers AND the bundled UI is really mounted — the failure mode of a naive
      # bundle is a working API in front of a blank page.
      - name: Smoke-test the executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OIS_PORT: "8123"
          OIS_OPEN_BROWSER: "0" # headless runner: never try to launch a browser
        run: |
          $exe = Start-Process -FilePath (Resolve-Path '${{ matrix.binary-path }}') -PassThru
          try {
            $ready = $false
            foreach ($i in 1..60) {
              try { Invoke-RestMethod 'http://127.0.0.1:8123/api/health' -TimeoutSec 2 | Out-Null; $ready = $true; break }
              catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'The executable never answered on /api/health' }
            $page = (Invoke-WebRequest 'http://127.0.0.1:8123/' -TimeoutSec 10).Content
            if ($page -notmatch '<div id="root">') { throw 'The bundled UI was not served at /' }
            Write-Host 'Smoke test passed: API answered and the bundled UI was served.'
          } finally {
            # /T matters: a one-file bundle is a bootloader parent plus the real
            # Python child, and killing only the parent orphans the server.
            taskkill /PID $exe.Id /T /F 2>&1 | Out-Null
            $global:LASTEXITCODE = 0 # teardown must not decide the step's result
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.binary-path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: draft-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      # draft: true — a human reviews and publishes. A tag never ships on its own.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
