name: CI

# Four jobs, four required status checks: lint-py, test-py, lint-ui, test-ui.
# A red pipeline is never merged, never bypassed, never --no-verify'd (see CLAUDE.md).
#
# NOTE ON REQUIRED CHECKS: `test-py` is a matrix job, so GitHub reports one check per
# combination, named `test-py (ubuntu-latest, 3.12)`, `test-py (ubuntu-latest, 3.13)`,
# `test-py (windows-latest, 3.12)` and `test-py (windows-latest, 3.13)` — there is no
# check literally named `test-py`. Configure branch protection / the ruleset with those
# expanded names (or all four of them) rather than the bare job id.
#
# NOTE ON SIMULATORS: CI never needs a simulator. Everything here runs against
# FakeSimAdapter. Sim tests are marked `@pytest.mark.sim` and are already excluded by
# the pyproject addopts (`-m "not sim"`). Do not add X-Plane, MSFS or any simulator to
# any job in this file.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same ref: only the latest push to a PR matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-py:
    name: lint-py
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff — lint
        run: ruff check .

      - name: Ruff — format check
        run: ruff format --check .

      - name: Mypy
        run: mypy .

  test-py:
    name: test-py
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Sim tests are excluded by the pyproject addopts (-m "not sim").
      # This runs unit + contract tests against FakeSimAdapter only.
      - name: Pytest
        run: pytest --cov

  lint-ui:
    name: lint-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

  test-ui:
    name: test-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
